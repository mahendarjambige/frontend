# ===================================================================
# In-Memory H2 Database Configuration (Zero-configuration fallback)
# ===================================================================

server.port=8080
spring.application.name=survey-polling-system

spring.datasource.url=jdbc:h2:mem:survey_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never

